<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" role="img" aria-label="Dependency graph of evict_ro: reclaimer pushes out an RO page (no LZ4 job)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#52514e"/></marker>
<marker id="arrow-bold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#0b0b0b"/></marker>
<pattern id="standstill" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#eeede8"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8983" stroke-width="2"/></pattern>
</defs>
<rect width="760" height="760" fill="#fcfcfb"/>
<text x="40.0" y="34.0" font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="bold" >evict_ro: reclaimer pushes out an RO page (no LZ4 job)</text>
<text x="40.0" y="58.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal" >6 steps. One after the other: 900 ns. Longest path through the graph: 900 ns. Assumed step costs, not measurements.</text>
<rect x="40.0" y="88" width="356.0" height="540.0" rx="8" fill="#fbf2ed"/>
<rect x="40.0" y="88" width="356.0" height="5" rx="2" fill="#eb6834"/>
<text x="218.0" y="112.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" >Kernel, mm_lock held</text>
<rect x="44.0" y="134.0" width="348.0" height="486.0" rx="6" fill="#f9ded3" stroke="#eb6834" stroke-width="1"/>
<path d="M231.0,310.0 L231.0,327.0 L306.0,327.0 L306.0,522.0 L306.0,555.0" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"><title>pick_victim before set_compressed: needs state[*]</title></path>
<path d="M218.0,210.0 L218.0,255.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)" stroke-dasharray="6 4"><title>reclaim_check before pick_victim: a victim is picked only while frames are short</title></path>
<path d="M205.0,310.0 L205.0,322.0 L218.0,322.0 L218.0,355.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)"><title>pick_victim before pte_clear: needs victim</title></path>
<path d="M218.0,410.0 L218.0,455.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)" stroke-dasharray="6 4"><title>pte_clear before tlb_inval: PTE first, then the TLBs</title></path>
<path d="M218.0,510.0 L218.0,527.0 L130.0,527.0 L130.0,555.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)" stroke-dasharray="6 4"><title>tlb_inval before put_frame: no core may reach the frame through an old TLB entry once another page owns it</title></path>
<text x="52.0" y="148.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="bold" stroke="#f9ded3" stroke-width="4" paint-order="stroke" stroke-linejoin="round">critical section A</text>
<rect x="140.0" y="156.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#0b0b0b" stroke-width="2.6"><title>reclaim_check</title></rect>
<text x="218.0" y="173.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >free frames &lt;</text>
<text x="218.0" y="188.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >fc_high?</text>
<rect x="140.0" y="256.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#0b0b0b" stroke-width="2.6"><title>pick_victim</title></rect>
<text x="218.0" y="273.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >clock scan: pick a</text>
<text x="218.0" y="288.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >victim</text>
<text x="289.0" y="304.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="bold" >300 ns</text>
<rect x="140.0" y="356.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#0b0b0b" stroke-width="2.6"><title>pte_clear</title></rect>
<text x="218.0" y="376.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >make PTE invalid</text>
<text x="289.0" y="404.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="bold" >100 ns</text>
<rect x="140.0" y="456.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#0b0b0b" stroke-width="2.6"><title>tlb_inval</title></rect>
<text x="218.0" y="473.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >TLB invalidate, all</text>
<text x="218.0" y="488.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >cores</text>
<text x="289.0" y="504.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="bold" >500 ns</text>
<rect x="52.0" y="556.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#0b0b0b" stroke-width="2.6"><title>put_frame</title></rect>
<text x="130.0" y="573.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >frame back to free</text>
<text x="130.0" y="588.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >list</text>
<rect x="228.0" y="556.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#eb6834" stroke-width="1.2"><title>set_compressed</title></rect>
<text x="306.0" y="576.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >state = COMPRESSED</text>
<line x1="40" y1="656" x2="86" y2="656" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="96.0" y="660.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" >needs what the step above produced</text>
<line x1="40" y1="680" x2="86" y2="680" stroke="#52514e" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="96.0" y="684.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" >ordering rule (reasons in the document)</text>
<line x1="40" y1="704" x2="86" y2="704" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)"/>
<text x="96.0" y="708.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" >longest path: it sets the time; steps on it have a thick border</text>
<text x="40.0" y="734.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" >Number in a step: assumed cost. &quot;? ns&quot;: cost not in the model. No number: a few instructions, not costed.</text>
</svg>
