<rect width="1180" height="520" fill="#fcfcfb"/>
<text x="30.0" y="36.0" font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="bold" >Three operations at once: where they stand still for each other</text>
<text x="30.0" y="60.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal" >A constructed moment: two faults arrive while the reclaimer compresses a page. Each runs on a core of its own. Assumed step costs.</text>
