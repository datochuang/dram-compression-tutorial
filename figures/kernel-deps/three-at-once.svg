<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-label="Two page faults and one eviction at the same time, with the stretches where one waits for the lock or for the LZ4 engine" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
