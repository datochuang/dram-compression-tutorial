<path d="M777.0,1010.0 L777.0,1027.0 L306.0,1027.0 L306.0,1055.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)"><title>cpl_read before cot_store: needs cpl</title></path>
