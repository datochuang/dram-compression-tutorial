<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 1060" width="832" height="1060" role="img" aria-label="Dependency graph of first_touch: first touch of an RW page (no LZ4 job)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#52514e"/></marker>
<marker id="arrow-bold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#0b0b0b"/></marker>
<pattern id="standstill" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#eeede8"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8a8983" stroke-width="2"/></pattern>
</defs>
<rect width="832" height="1060" fill="#fcfcfb"/>
<text x="40.0" y="34.0" font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="bold" >first_touch: first touch of an RW page (no LZ4 job)</text>
<text x="40.0" y="58.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="normal" >11 steps. One after the other: 1600 ns. Longest path through the graph: 1600 ns. Assumed step costs, not measurements.</text>
<rect x="40.0" y="88" width="180.0" height="840.0" rx="8" fill="#edf3f8"/>
<rect x="40.0" y="88" width="180.0" height="5" rx="2" fill="#2a78d6"/>
<text x="130.0" y="112.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" >CPU</text>
<rect x="260.0" y="88" width="532.0" height="840.0" rx="8" fill="#fbf2ed"/>
<rect x="260.0" y="88" width="532.0" height="5" rx="2" fill="#eb6834"/>
<text x="526.0" y="112.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" >Kernel, mm_lock held</text>
<rect x="264.0" y="334.0" width="524.0" height="386.0" rx="6" fill="#f9ded3" stroke="#eb6834" stroke-width="1"/>
<path d="M552.0,410.0 L552.0,427.0 L614.0,427.0 L614.0,522.0 L614.0,555.0" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"><title>check_state before set_present: needs state[h]</title></path>
<path d="M526.0,410.0 L526.0,432.0 L350.0,432.0 L350.0,622.0 L526.0,622.0 L526.0,655.0" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"><title>check_state before note_fresh: needs s</title></path>
<path d="M539.0,510.0 L539.0,532.0 L702.0,532.0 L702.0,627.0 L702.0,655.0" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"><title>take_frame before wake_check: needs free_frames</title></path>
<path d="M526.0,710.0 L526.0,722.0 L130.0,722.0 L130.0,755.0" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="6 4"><title>note_fresh before eret: page protected before the thread leaves the kernel</title></path>
<path d="M130.0,210.0 L130.0,255.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)" stroke-dasharray="6 4"><title>access before exception: the CPU MMU finds the PTE not valid</title></path>
<path d="M130.0,310.0 L130.0,322.0 L526.0,322.0 L526.0,355.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)" stroke-dasharray="6 4"><title>exception before check_state: the kernel runs once the CPU has taken the exception</title></path>
<path d="M500.0,410.0 L500.0,422.0 L526.0,422.0 L526.0,455.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)"><title>check_state before take_frame: needs free_frames</title></path>
<path d="M513.0,510.0 L513.0,527.0 L438.0,527.0 L438.0,555.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)"><title>take_frame before zero_frame: needs f</title></path>
<path d="M438.0,610.0 L438.0,632.0 L350.0,632.0 L350.0,655.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)" stroke-dasharray="6 4"><title>zero_frame before pte_map: frame content before the PTE is valid</title></path>
<path d="M130.0,810.0 L130.0,855.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)"><title>eret before rerun: needs pc</title></path>
<path d="M304.0,720.0 L304.0,734.0 L130.0,734.0 L130.0,755.0" fill="none" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)"/>
<text x="312.0" y="748.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" stroke="#fcfcfb" stroke-width="4" paint-order="stroke" stroke-linejoin="round">every step of section A is done</text>
<text x="272.0" y="348.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="bold" stroke="#f9ded3" stroke-width="4" paint-order="stroke" stroke-linejoin="round">critical section A</text>
<rect x="52.0" y="156.0" width="156" height="54" rx="7" fill="#accaed" stroke="#0b0b0b" stroke-width="2.6"><title>access</title></rect>
<text x="130.0" y="173.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >instruction touches</text>
<text x="130.0" y="188.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >page h</text>
<rect x="52.0" y="256.0" width="156" height="54" rx="7" fill="#accaed" stroke="#0b0b0b" stroke-width="2.6"><title>exception</title></rect>
<text x="130.0" y="276.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >page fault exception</text>
<text x="201.0" y="304.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="bold" >600 ns</text>
<rect x="448.0" y="356.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#0b0b0b" stroke-width="2.6"><title>check_state</title></rect>
<text x="526.0" y="373.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >read state[h], any free</text>
<text x="526.0" y="388.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >frame?</text>
<rect x="448.0" y="456.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#0b0b0b" stroke-width="2.6"><title>take_frame</title></rect>
<text x="526.0" y="476.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >take a free frame</text>
<text x="597.0" y="504.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="bold" >100 ns</text>
<rect x="360.0" y="556.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#0b0b0b" stroke-width="2.6"><title>zero_frame</title></rect>
<text x="438.0" y="576.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >fill frame with zeros</text>
<text x="509.0" y="604.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="bold" >400 ns</text>
<rect x="536.0" y="556.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#eb6834" stroke-width="1.2"><title>set_present</title></rect>
<text x="614.0" y="576.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >state = PRESENT</text>
<rect x="272.0" y="656.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#0b0b0b" stroke-width="2.6"><title>pte_map</title></rect>
<text x="350.0" y="676.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >make PTE valid</text>
<text x="421.0" y="704.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="bold" >100 ns</text>
<rect x="448.0" y="656.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#eb6834" stroke-width="1.2"><title>note_fresh</title></rect>
<text x="526.0" y="673.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >protect page from</text>
<text x="526.0" y="688.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >reclaimer</text>
<rect x="624.0" y="656.0" width="156" height="54" rx="7" fill="#f6c4af" stroke="#eb6834" stroke-width="1.2"><title>wake_check</title></rect>
<text x="702.0" y="673.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >few frames left? wake</text>
<text x="702.0" y="688.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >reclaimer</text>
<rect x="52.0" y="756.0" width="156" height="54" rx="7" fill="#accaed" stroke="#0b0b0b" stroke-width="2.6"><title>eret</title></rect>
<text x="130.0" y="776.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >return from exception</text>
<text x="201.0" y="804.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="bold" >400 ns</text>
<rect x="52.0" y="856.0" width="156" height="54" rx="7" fill="#accaed" stroke="#0b0b0b" stroke-width="2.6"><title>rerun</title></rect>
<text x="130.0" y="876.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal" >instruction runs again</text>
<line x1="40" y1="956" x2="86" y2="956" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="96.0" y="960.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" >needs what the step above produced</text>
<line x1="40" y1="980" x2="86" y2="980" stroke="#52514e" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="96.0" y="984.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" >ordering rule (reasons in the document)</text>
<line x1="40" y1="1004" x2="86" y2="1004" stroke="#0b0b0b" stroke-width="2.6" marker-end="url(#arrow-bold)"/>
<text x="96.0" y="1008.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal" >longest path: it sets the time; steps on it have a thick border</text>
<text x="40.0" y="1034.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" >Number in a step: assumed cost. &quot;? ns&quot;: cost not in the model. No number: a few instructions, not costed.</text>
</svg>
