<title>LZ4 Lesson</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root { color-scheme: dark; --bg: #0b1118; --panel: #0e161f; --card: #121c27; --line: #263546; --ink: #dfe8f1; --dim: #8ea2b6;
  --kernel: #f4d35e; --hw: #b48cff; --user: #ff8fb1; --note: #7ee2a8; --ro: #35b56f; --rw: #3d8bff; --bad: #ff5d5d; --slot: #18222d;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
  font: 15px/1.55 "IBM Plex Sans", "PingFang TC", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
#app { height: 100%; min-height: 460px; display: grid; background: var(--bg);
  grid-template: "top top" auto "stage panel" minmax(0, 1fr) "bar panel" auto / minmax(0, 1fr) 420px; }
#top { grid-area: top; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; border-bottom: 1px solid var(--line);
  padding: 9px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
h1 { font-size: 16px; margin: 0; font-weight: 650; }
#scene { color: var(--dim); font-size: 13px; }
.chip { font: 700 11px/1.7 var(--mono); letter-spacing: 0.06em; border-radius: 999px; padding: 0 9px; color: #10161d; background: var(--dim); white-space: nowrap; }
#design { background: var(--hw); }
#stage { grid-area: stage; position: relative; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
#cv { display: block; width: 100%; height: 100%; }
#bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.bub { position: absolute; left: 0; top: 0; visibility: hidden; width: max-content; max-width: min(300px, 62%); background: #f7f9fc; color: #10161d;
  border: 3px solid var(--c); border-radius: 14px; padding: 7px 11px 8px; font-size: 16px; line-height: 1.28; font-weight: 650;
  overflow-wrap: anywhere; box-shadow: 0 5px 16px rgba(0, 0, 0, 0.5); }
.bname { display: block; width: max-content; font: 800 12px/1.5 var(--mono); letter-spacing: 0.06em; color: #141a22; background: var(--c);
  border-radius: 999px; padding: 0 8px; margin: 0 0 4px -2px; white-space: nowrap; }
.btext { white-space: pre-line; }
.bub.quiet { padding: 0; border: 0; background: none; box-shadow: none; }
.bub.quiet .btext { display: none; }
.bub.quiet .bname { margin: 0; font-size: 12px; padding: 2px 9px; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5); }
#tails { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#tails path { fill: #f7f9fc; stroke-width: 3; stroke-linejoin: round; }
#camReset { position: absolute; right: 10px; bottom: 10px; z-index: 3; min-height: 34px; font-size: 12px; }
#err { position: absolute; inset: 30% 16px auto; text-align: center; color: #ffb4b4; }
button { font: inherit; color: var(--ink); background: #1a2633; border: 1px solid var(--line); border-radius: 9px; min-height: 40px; padding: 0 14px; cursor: pointer; }
button:hover { background: #223244; }
button:focus-visible, #dots button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
#bar { grid-area: bar; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
  padding: 8px 12px max(8px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#play { min-width: 92px; background: #2b3d52; font-weight: 650; }
#pos { font: 12px var(--mono); color: var(--dim); }
#dots { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 200px; }
#dots button { width: 18px; min-height: 18px; height: 18px; padding: 0; border-radius: 5px; border: 0; background: var(--c); opacity: 0.32; }
#dots button.seen { opacity: 0.6; } #dots button.on { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #fff; }
#panel { grid-area: panel; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px 16px; }
#stepHead { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
#stepNo { font: 12px var(--mono); color: var(--dim); }
#who { background: var(--c); }
h2 { font-size: 19px; line-height: 1.3; margin: 2px 0 8px; font-weight: 700; }
#text p { margin: 0 0 8px; }
#text b { color: #fff; font-weight: 650; }
code, .m { font-family: var(--mono); font-size: 0.92em; }
#text code { background: var(--slot); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
.k { color: var(--kernel); } .h { color: var(--hw); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px 10px; margin-top: 12px; }
.card h3 { font: 700 11.5px/1.4 var(--mono); letter-spacing: 0.07em; color: var(--dim); margin: 0 0 6px; text-transform: uppercase; }
.card h3 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font: 600 10.5px var(--mono); color: var(--dim); letter-spacing: 0.04em; padding: 2px 6px 4px 0; white-space: nowrap; }
td { padding: 3px 6px 3px 0; border-top: 1px solid #1c2836; vertical-align: top; font-family: var(--mono); }
td.t { font-family: inherit; }
tr.hot td { background: #1d2c3d; color: #fff; } tr.hot td:first-child { box-shadow: inset 3px 0 0 #fff; padding-left: 6px; }
tr.off td { color: #5d6f82; }
.by { display: inline-block; min-width: 1.75em; text-align: center; border-radius: 3px; margin: 0 1px 1px 0; padding: 0 2px; background: var(--slot); color: #6f8296; }
.by.k { background: var(--kernel); color: #10161d; font-weight: 600; } .by.h { background: var(--hw); color: #10161d; font-weight: 600; }
.wr { display: inline-block; border-radius: 3px; padding: 0 5px; font: 700 11px/1.6 var(--mono); color: #10161d; }
.wr.k { background: var(--kernel); } .wr.h { background: var(--hw); } .wr.n { background: none; color: #5d6f82; font-weight: 500; }
#ledger td:first-child { font-family: inherit; }
#ledger td.c { text-align: center; width: 84px; } #ledger th.c { text-align: center; }
#ledger tr.new td { background: #1d2c3d; }
#clock { margin-top: 8px; font: 12px var(--mono); color: var(--dim); }
#clock b { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--dim); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.hatch { background: repeating-linear-gradient(135deg, #dfe8f1 0 2px, #5b6672 2px 4px); }
.tick { background: linear-gradient(225deg, #fff 0 50%, var(--slot) 50%); }
@media (max-width: 820px) {
  #app { grid-template: "top" auto "stage" minmax(200px, 42%) "panel" minmax(0, 1fr) "bar" auto / minmax(0, 1fr); }
  #panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  #scene { display: none; } h2 { font-size: 17px; } .bub { font-size: 14px; max-width: min(240px, 66%); }
  #dots { order: 5; flex-basis: 100%; } #dots button { width: 11px; height: 14px; min-height: 14px; border-radius: 3px; gap: 3px; }
  #bar { padding-right: max(16px, env(safe-area-inset-right, 0px)); } #pos { margin-left: auto; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
<div id="app">
  <header id="top">
    <h1 id="title">LZ4 lesson</h1><span class="chip" id="design"></span><span id="scene"></span>
  </header>
  <div id="stage"><canvas id="cv" aria-label="3D stage of the lesson"></canvas>
    <div id="bubbles" aria-hidden="true"><svg id="tails"></svg></div>
    <button type="button" id="camReset" title="Back to this step's view">Reset view</button>
    <div id="err" hidden></div>
  </div>
  <aside id="panel" aria-live="polite">
    <div id="stepHead"><span id="stepNo"></span><span class="chip" id="who"></span></div>
    <h2 id="stepTitle"></h2>
    <div id="text"></div>
    <div id="focus"></div>
    <div class="card"><h3>Who touched what <span>(R = read, W = write)</span></h3>
      <table id="ledger"></table>
      <div id="clock"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--kernel)"></i>written by KERNEL SW</span>
      <span><i style="background:var(--hw)"></i>written by LZ4 HW</span>
      <span><i class="tick"></i>corner mark: who read it</span>
      <span><i style="background:var(--rw)"></i>RW page data</span>
      <span><i class="hatch"></i>compressed data</span>
    </div>
  </aside>
  <nav id="bar" aria-label="Steps">
    <button type="button" id="prev" aria-label="Previous step">&#9664; Prev</button>
    <button type="button" id="play">&#9654; Play</button>
    <button type="button" id="next" aria-label="Next step">Next &#9654;</button>
    <span id="pos"></span>
    <div id="dots" role="group" aria-label="Jump to a step"></div>
  </nav>
</div>
